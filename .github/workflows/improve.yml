name: AI Improvement

on:
  schedule:
    - cron: '0 */2 * * *'

  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/improve_code.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .

          git commit -m "AI automated improvement"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

          commit-message: "AI automated improvement"

          title: "AI Improvement"

          body: |
            Automated safe incremental improvement generated by AI agent.

            Validation pipeline executed:
            - Ruff
            - Black
            - Pytest

          branch: ai-improvement

          delete-branch: true

          base: main